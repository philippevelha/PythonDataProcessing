# Renders the committed notebooks (with their saved outputs) to HTML and publishes them on GitHub Pages.
# Notebooks are NOT re-executed here: the raw data is not in the repository.
name: Publish notebooks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nbconvert
      - name: Render notebooks
        run: |
          mkdir -p _site
          jupyter nbconvert --to html --output-dir _site notebooks/*.ipynb
          cp lvm_reader.py _site/
          cp -r site/. _site/
          {
            echo '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>LVM analysis</title><style>:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;max-width:720px;margin:3rem auto;padding:0 16px;line-height:1.5}</style></head><body>'
            echo '<h1>LVM data analysis</h1>'
            echo '<p><a href="browser.html"><b>Trace browser</b></a>: browse every recorded time series.</p>'
            echo '<h2>Notebooks</h2><ul>'
            for f in notebooks/*.ipynb; do n=$(basename "$f" .ipynb); echo "<li><a href=\"$n.html\">$n</a></li>"; done
            echo '</ul></body></html>'
          } > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
